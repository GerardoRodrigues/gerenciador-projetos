<div class="space-y-8 max-w-4xl">
  <div class="border-b border-white/10 pb-6">
    <h1 class="text-2xl sm:text-3xl font-bold text-slate-100 tracking-tight">Configurações</h1>
    <nav class="flex flex-wrap gap-2 sm:gap-3 mt-5">
      <a
        [routerLink]="['../profile']"
        routerLinkActive="!bg-indigo-500/20 !text-indigo-300 font-semibold border border-indigo-500/30"
        class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-400 hover:bg-white/5 hover:text-slate-200 transition-all flex items-center gap-2"
        >👤 Perfil</a
      >
      <a
        [routerLink]="['../billing']"
        routerLinkActive="!bg-indigo-500/20 !text-indigo-300 font-semibold border border-indigo-500/30"
        class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-400 hover:bg-white/5 hover:text-slate-200 transition-all flex items-center gap-2"
        >💳 Faturamento</a
      >
    </nav>
  </div>

  <div
    class="bg-[#1e1e3a]/60 backdrop-blur-md border border-white/10 rounded-2xl p-6 sm:p-8 space-y-6 shadow-xl"
  >
    <div
      class="flex flex-col sm:flex-row sm:items-center justify-between pb-5 border-b border-white/5 gap-1"
    >
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Nome</span>
      <span class="text-base font-semibold text-slate-100">{{ _authManager.user()?.name }}</span>
    </div>
    <div
      class="flex flex-col sm:flex-row sm:items-center justify-between pb-5 border-b border-white/5 gap-1"
    >
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Email</span>
      <span class="text-sm text-slate-300">{{ _authManager.user()?.email }}</span>
    </div>
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Role</span>
      <span
        class="capitalize text-xs font-semibold text-indigo-400 bg-indigo-500/10 px-3 py-1 rounded-full"
        >{{ _authManager.user()?.role }}</span
      >
    </div>
  </div>
</div>
