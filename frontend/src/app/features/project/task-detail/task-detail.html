@if (editedTask(); as taskToEdit) {
  <div class="fixed inset-0 bg-black/75 backdrop-blur-sm z-[100] transition-opacity" (click)="close()"></div>
  <div class="fixed top-0 right-0 w-full sm:w-[500px] h-full bg-[#111128] border-l border-white/15 z-[101] flex flex-col p-6 sm:p-8 shadow-2xl animate-[slideIn_0.2s_ease]">
    <div class="flex items-center justify-between mb-8 pb-5 border-b border-white/10">
      <div class="flex items-center gap-3">
        <span class="w-2 h-6 bg-indigo-500 rounded-full"></span>
        <h2 class="text-xl font-extrabold text-white tracking-tight">Editar Tarefa <span class="font-mono text-indigo-400 font-normal">#{{ task()?.id }}</span></h2>
      </div>
      <button class="text-slate-400 hover:text-white hover:bg-white/10 p-2 rounded-xl transition-all text-sm font-bold" (click)="close()">✕ fechar</button>
    </div>

    <form class="flex-1 flex flex-col gap-6 overflow-y-auto pr-1">
      <div class="flex flex-col gap-2">
        <label class="text-xs font-bold uppercase tracking-wider text-slate-300">Título da Tarefa</label>
        <input
          type="text"
          [(ngModel)]="taskToEdit.title"
          name="title"
          class="bg-[#1a1838] border border-white/15 rounded-xl px-4 py-3.5 text-white text-sm font-medium focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 transition-all shadow-inner"
          (ngModelChange)="markDirty()"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-xs font-bold uppercase tracking-wider text-slate-300">Descrição Detalhada</label>
        <textarea
          [(ngModel)]="taskToEdit.description"
          name="description"
          class="bg-[#1a1838] border border-white/15 rounded-xl px-4 py-3.5 text-white text-sm font-medium focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 transition-all resize-y min-h-[140px] shadow-inner leading-relaxed"
          rows="5"
          (ngModelChange)="markDirty()"
        ></textarea>
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-xs font-bold uppercase tracking-wider text-slate-300">Status no Fluxo</label>
        <select
          [(ngModel)]="taskToEdit.status"
          name="status"
          class="bg-[#1a1838] border border-white/15 rounded-xl px-4 py-3.5 text-white text-sm font-bold focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 transition-all cursor-pointer [&>option]:bg-[#1a1838] shadow-inner"
          (ngModelChange)="markDirty()"
        >
          <option value="todo">A Fazer</option>
          <option value="in_progress">Em Progresso</option>
          <option value="done">Concluído</option>
        </select>
      </div>
    </form>

    <div class="flex items-center justify-between gap-4 pt-5 border-t border-white/10 mt-6">
      @if (isDirty()) {
        <span class="text-xs text-amber-300 font-bold flex items-center gap-2 bg-amber-500/10 px-3 py-1.5 rounded-lg border border-amber-500/20">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
          Alterações pendentes
        </span>
      } @else {
        <span class="text-xs text-slate-500 font-medium">Nenhuma alteração</span>
      }
      <div class="flex items-center gap-3">
        <button type="button" class="px-4 py-2.5 rounded-xl border border-white/10 text-slate-300 hover:bg-white/5 text-sm font-medium transition-all" (click)="close()">Cancelar</button>
        <button type="button" class="bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 disabled:opacity-40 disabled:cursor-not-allowed text-white text-sm font-bold py-2.5 px-6 rounded-xl shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 transition-all" (click)="save()" [disabled]="!isDirty() || isSaving()">
          {{ isSaving() ? 'Gravando...' : 'Salvar Tarefa' }}
        </button>
      </div>
    </div>
  </div>
}
