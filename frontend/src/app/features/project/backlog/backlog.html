<div class="space-y-8 max-w-7xl mx-auto">
  <div
    class="border-b border-white/10 pb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4"
  >
    <div>
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span>
        <h1 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-white tracking-tight">
          {{ project.name }} — Backlog
        </h1>
      </div>
      <p class="text-sm sm:text-base text-slate-400 mt-1">
        {{ project.description }}
      </p>
    </div>
    <nav
      class="flex flex-wrap gap-2 sm:gap-2.5 bg-[#13132b] p-1.5 rounded-2xl border border-white/10 self-start"
    >
      <a
        [routerLink]="['../board']"
        routerLinkActive="!bg-indigo-500 !text-white font-bold shadow-md shadow-indigo-500/30"
        class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-400 hover:text-slate-200 transition-all flex items-center gap-2"
        >📌 Kanban Board</a
      >
      <a
        [routerLink]="['../backlog']"
        routerLinkActive="!bg-indigo-500 !text-white font-bold shadow-md shadow-indigo-500/30"
        class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-400 hover:text-slate-200 transition-all flex items-center gap-2"
        >📋 Backlog</a
      >
      <a
        [routerLink]="['../settings']"
        routerLinkActive="!bg-indigo-500 !text-white font-bold shadow-md shadow-indigo-500/30"
        class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-400 hover:text-slate-200 transition-all flex items-center gap-2"
        >⚙️ Configurações</a
      >
    </nav>
  </div>

  <div class="bg-[#13132b]/90 border border-white/10 rounded-2xl overflow-hidden shadow-2xl">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse min-w-[650px]">
        <thead>
          <tr
            class="bg-black/30 border-b border-white/10 text-slate-400 text-xs uppercase tracking-wider font-bold"
          >
            <th class="py-4 px-6 w-24">ID</th>
            <th class="py-4 px-6">Título da Tarefa</th>
            <th class="py-4 px-6 w-40">Status</th>
            <th class="py-4 px-6">Descrição</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-white/5">
          @for (task of tasks(); track task.id) {
            <tr [id]="task.id" class="hover:bg-white/5 transition-colors group">
              <td class="py-4 px-6 font-mono text-xs font-bold text-indigo-400 whitespace-nowrap">
                #{{ task.id }}
              </td>
              <td
                class="py-4 px-6 font-bold text-slate-100 text-sm group-hover:text-indigo-300 transition-colors"
              >
                {{ task.title }}
              </td>
              <td class="py-4 px-6 whitespace-nowrap">
                <span
                  class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg text-xs font-bold data-[status=todo]:bg-slate-500/20 data-[status=todo]:text-slate-300 data-[status=todo]:border data-[status=todo]:border-slate-500/30 data-[status=in_progress]:bg-amber-500/20 data-[status=in_progress]:text-amber-300 data-[status=in_progress]:border data-[status=in_progress]:border-amber-500/30 data-[status=done]:bg-emerald-500/20 data-[status=done]:text-emerald-300 data-[status=done]:border data-[status=done]:border-emerald-500/30 shadow-xs"
                  [attr.data-status]="task.status"
                >
                  <span
                    class="w-1.5 h-1.5 rounded-full data-[status=todo]:bg-slate-400 data-[status=in_progress]:bg-amber-400 data-[status=done]:bg-emerald-400"
                    [attr.data-status]="task.status"
                  ></span>
                  {{ getStatusLabel(task.status) }}
                </span>
              </td>
              <td class="py-4 px-6 text-sm text-slate-400 max-w-md truncate">
                {{ task.description }}
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
