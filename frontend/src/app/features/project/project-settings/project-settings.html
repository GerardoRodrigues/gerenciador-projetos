<div class="space-y-8 max-w-7xl mx-auto">
  <div
    class="border-b border-white/10 pb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4"
  >
    <div>
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 animate-pulse"></span>
        <h1 class="text-2xl sm:text-3xl lg:text-4xl font-extrabold text-white tracking-tight">
          {{ project.name }} — Configurações
        </h1>
      </div>
      <p class="text-sm sm:text-base text-slate-400 mt-1">Ajustes gerais e parâmetros do projeto</p>
    </div>
    <nav
      class="flex flex-wrap gap-2 sm:gap-2.5 bg-[#13132b] p-1.5 rounded-2xl border border-white/10 self-start"
    >
      <a
        [routerLink]="['../board']"
        routerLinkActive="!bg-indigo-500 !text-white font-bold shadow-md shadow-indigo-500/30"
        class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-400 hover:text-slate-200 transition-all flex items-center gap-2"
        >📌 Kanban Board</a
      >
      <a
        [routerLink]="['../backlog']"
        routerLinkActive="!bg-indigo-500 !text-white font-bold shadow-md shadow-indigo-500/30"
        class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-400 hover:text-slate-200 transition-all flex items-center gap-2"
        >📋 Backlog</a
      >
      <a
        [routerLink]="['../settings']"
        routerLinkActive="!bg-indigo-500 !text-white font-bold shadow-md shadow-indigo-500/30"
        class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-400 hover:text-slate-200 transition-all flex items-center gap-2"
        >⚙️ Configurações</a
      >
    </nav>
  </div>

  <div
    class="bg-[#13132b]/90 border border-white/10 rounded-2xl p-6 sm:p-8 space-y-6 shadow-2xl max-w-4xl"
  >
    <div
      class="flex flex-col sm:flex-row sm:items-center justify-between pb-5 border-b border-white/5 gap-2"
    >
      <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Nome do Projeto</span>
      <span class="text-base font-bold text-white">{{ project.name }}</span>
    </div>
    <div
      class="flex flex-col sm:flex-row sm:items-center justify-between pb-5 border-b border-white/5 gap-2"
    >
      <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Descrição</span>
      <span class="text-sm text-slate-300 max-w-md">{{ project.description }}</span>
    </div>
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
      <span class="text-xs font-bold uppercase tracking-wider text-slate-400"
        >Identificador Único (ID)</span
      >
      <span
        class="font-mono text-xs font-bold text-indigo-300 bg-indigo-500/20 border border-indigo-500/30 px-3 py-1.5 rounded-lg"
        >{{ project.id }}</span
      >
    </div>
  </div>
</div>
