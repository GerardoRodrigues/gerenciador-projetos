<div class="space-y-8 max-w-5xl">
  <div class="border-b border-white/10 pb-6">
    <h1 class="text-2xl sm:text-3xl font-bold text-slate-100 tracking-tight">Administração</h1>
    <p class="text-sm text-slate-400 mt-1">Gerenciamento avançado do sistema</p>
    <nav class="flex flex-wrap gap-2 sm:gap-3 mt-5">
      <a
        [routerLink]="['../users']"
        routerLinkActive="!bg-indigo-500/20 !text-indigo-300 font-semibold border border-indigo-500/30"
        class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-400 hover:bg-white/5 hover:text-slate-200 transition-all flex items-center gap-2"
        >🔑 Usuários</a
      >
      <a
        [routerLink]="['../audit-log']"
        routerLinkActive="!bg-indigo-500/20 !text-indigo-300 font-semibold border border-indigo-500/30"
        class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-400 hover:bg-white/5 hover:text-slate-200 transition-all flex items-center gap-2"
        >📋 Audit Log</a
      >
    </nav>
  </div>

  <div class="bg-[#1e1e3a] border border-white/10 rounded-2xl overflow-hidden shadow-xl">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse min-w-[600px]">
        <thead>
          <tr
            class="bg-white/[0.02] border-b border-white/10 text-slate-400 text-xs uppercase tracking-wider font-semibold"
          >
            <th class="py-3.5 px-5">ID</th>
            <th class="py-3.5 px-5">Ação</th>
            <th class="py-3.5 px-5">Usuário</th>
            <th class="py-3.5 px-5">Data</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-white/[0.04]">
          @for (log of logs(); track log.id) {
            <tr class="hover:bg-white/[0.02] transition-colors">
              <td class="py-3.5 px-5 font-mono text-xs text-slate-500 whitespace-nowrap">
                {{ log.id }}
              </td>
              <td class="py-3.5 px-5">
                <span
                  class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold bg-indigo-500/15 text-indigo-300 font-mono"
                  >{{ log.action }}</span
                >
              </td>
              <td class="py-3.5 px-5 text-sm font-medium text-slate-200">{{ log.userId }}</td>
              <td class="py-3.5 px-5 text-xs text-slate-400 whitespace-nowrap">
                {{ log.timestamp | date: 'dd/MM/yyyy HH:mm' }}
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
