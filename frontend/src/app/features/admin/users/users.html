<div class="space-y-8 max-w-5xl">
  <div class="border-b border-white/10 pb-6">
    <h1 class="text-2xl sm:text-3xl font-bold text-slate-100 tracking-tight">Administração</h1>
    <p class="text-sm text-slate-400 mt-1">Gerenciamento avançado do sistema</p>
    <nav class="flex flex-wrap gap-2 sm:gap-3 mt-5">
      <a
        [routerLink]="['../users']"
        routerLinkActive="!bg-indigo-500/20 !text-indigo-300 font-semibold border border-indigo-500/30"
        class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-400 hover:bg-white/5 hover:text-slate-200 transition-all flex items-center gap-2"
        >🔑 Usuários</a
      >
      <a
        [routerLink]="['../audit-log']"
        routerLinkActive="!bg-indigo-500/20 !text-indigo-300 font-semibold border border-indigo-500/30"
        class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium text-slate-400 hover:bg-white/5 hover:text-slate-200 transition-all flex items-center gap-2"
        >📋 Audit Log</a
      >
    </nav>
  </div>

  <div class="space-y-3">
    @for (user of users(); track user.id) {
      <div
        data-testid="user-card"
        class="bg-[#1e1e3a]/60 backdrop-blur-md border border-white/10 hover:border-indigo-500/30 rounded-2xl p-4 sm:p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4 transition-all shadow-lg hover:shadow-indigo-500/10"
      >
        <div class="flex items-center gap-3.5 min-w-0">
          <div
            class="w-11 h-11 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 text-white font-bold flex items-center justify-center text-sm shrink-0 shadow-md"
          >
            {{ user.name | initials }}
          </div>
          <div class="flex flex-col min-w-0">
            <span class="font-semibold text-slate-100 text-sm truncate">{{ user.name }}</span>
            <span class="text-xs text-slate-400 truncate">{{ user.email }}</span>
          </div>
        </div>
        <div
          class="flex items-center justify-between sm:justify-end gap-3 pt-2 sm:pt-0 border-t sm:border-t-0 border-white/5"
        >
          <span
            class="px-3 py-1 rounded-full text-xs font-semibold capitalize tracking-wide bg-slate-500/15 text-slate-400 shrink-0"
            [class.!bg-indigo-500/20]="user.role === 'admin'"
            [class.!text-indigo-300]="user.role === 'admin'"
          >
            {{ user.role }}
          </span>
          <span class="font-mono text-[11px] text-slate-500 bg-black/20 px-2.5 py-1 rounded">{{
            user.id
          }}</span>
        </div>
      </div>
    }
  </div>
</div>
