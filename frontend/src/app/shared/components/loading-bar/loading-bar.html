@if (isLoading()) {
  <div class="fixed top-0 left-0 w-full h-1 z-[99999] overflow-hidden bg-white/10">
    <div class="h-full bg-gradient-to-r from-cyan-400 via-pink-500 to-yellow-400 bg-[length:200%_100%] shadow-[0_0_12px_rgba(245,87,108,0.8),0_0_20px_rgba(0,242,254,0.8)] animate-[loading_1.2s_ease-in-out_infinite]"></div>
  </div>
}
